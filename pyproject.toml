[project]
name = "grok-gadgets-home-assistant"
version = "0.1.0a1"
description = "Read-only Home Assistant MCP compatibility diagnostics for Grok Gadgets"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["mcp==2.3.0"]

[project.scripts]
ha-probe = "ha_probe:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ha_probe"]

[dependency-groups]
dev = ["ruff==0.15.7"]

[tool.ruff]
line-length = 100
